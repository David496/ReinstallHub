appId: com.reinstallhub.app
productName: ReInstall Hub
copyright: Copyright © 2026 ReInstall Hub Team

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - data/**/*
  - public/**/*
  - package.json

win:
  target:
    - target: zip
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: public/icons/icon.ico
  requestedExecutionLevel: asInvoker
  artifactName: "ReInstall-Hub-Portable-Folder-${version}.${ext}"

portable:
  artifactName: "ReInstall-Hub-Portable-${version}.${ext}"
